# 기본 규칙에 예외만 추가합니다. 테스트 폴더도 검사 대상입니다.
[extend]
useDefault = true

[allowlist]
description = "예시 설정, lock 파일, 테스트용 합성 값"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)uv\.lock$''',
]
# 테스트용 합성 값은 sk-test-synthetic-<영소문자·숫자·하이픈> 형식으로 씁니다. (예: sk-test-synthetic-value)
# 값 전체가 이 형식일 때만 제외합니다. 실제 비밀값에 synthetic이 섞여 있어도 걸러지지 않게 하려는 것입니다.
regexTarget = "secret"
regexes = [
  '''^sk-test-synthetic-[a-z0-9-]+$''',
]
