# 루트에서 `pnpm install` 하면 훅이 설치됩니다.
# 윈도우에서도 동작하도록 셸 문법(&&, $(), 파이프) 없이 명령 하나씩 실행합니다.
# 같은 파일을 린트·포맷이 동시에 고치지 않도록 순서대로 실행합니다.
pre-commit:
  piped: true
  commands:
    frontend-lint:
      root: "frontend/"
      glob: "*.{ts,tsx,js,mjs}"
      # exclude는 레포 루트 기준 경로입니다.
      exclude:
        - "frontend/src/types/api.gen.ts"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
      priority: 1
    frontend-format:
      root: "frontend/"
      glob: "*.{ts,tsx,js,mjs,json,css,md}"
      exclude:
        - "frontend/src/types/api.gen.ts"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
      priority: 2
    backend-lint:
      root: "backend/"
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
      priority: 3
    backend-format:
      root: "backend/"
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
      priority: 4
    backend-layers:
      root: "backend/"
      glob: "*.py"
      run: uv run lint-imports
      priority: 5

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.mjs {1}

# push할 커밋에 바뀐 영역이 있을 때만 단위 테스트를 실행합니다. (DB가 필요한 integration은 CI에서)
pre-push:
  parallel: true
  commands:
    frontend-test:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      files: git diff --name-only origin/develop...HEAD
      run: pnpm exec vitest run
    backend-test:
      root: "backend/"
      glob: "*.py"
      files: git diff --name-only origin/develop...HEAD
      # 단위 테스트만 경로로 고릅니다. -m "..." 처럼 따옴표가 든 인자는 Windows에서 쪼개집니다.
      run: uv run pytest tests/unit -q
