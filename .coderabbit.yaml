# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    # 기본 브랜치가 무엇이든 develop·main 대상 PR을 모두 리뷰합니다.
    base_branches:
      - develop
      - main

  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!**/uv.lock"
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!frontend/src/types/api.gen.ts"
    - "!backend/experiments/**"

  instructions: |
    ## 리뷰 원칙
    - 런타임 에러, 타입 안전성, 비동기·스트리밍(SSE) 에러 처리에 집중
    - 스타일/포맷팅은 ESLint + Prettier, ruff가 처리하므로 지적하지 않기
    - 이 프로젝트는 monorepo: frontend(Next.js App Router+TanStack Query, Vercel), backend(FastAPI+SQLAlchemy+Alembic+LangGraph, AWS Lightsail)
    - 중장년층 실업급여 서비스: 개인정보(이름, 연락처, 주민등록번호, 발화 원문)가 로그·LLM 전송·테스트 데이터에 들어가는지 반드시 확인

    ## 프론트·백엔드 동기화
    - 백엔드 API를 바꾸고 frontend/src/types/api.gen.ts를 재생성(pnpm gen:api)하지 않은 PR은 지적
    - SSE 이벤트 이름은 shared/sse-events.json에만 정의. 한쪽에 문자열을 하드코딩한 PR은 지적

    ## 네이밍 (핵심만)
    - Boolean: is/has 접두사
    - 이벤트 핸들러: handle~ 접두사, Props 콜백: on~ 접두사
    - Pydantic 모델: Read/Create/Update 접미사, API 경로는 kebab-case 복수형

  path_instructions:
    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: |
        Next.js 규칙:
        - 서버 렌더링·RSC 데이터 패칭·Next.js 캐시 사용 금지. 데이터는 'use client' 컴포넌트에서 TanStack Query로 FastAPI 호출
        - 'use client'는 상태·이벤트가 있는 컴포넌트에만
        - 라우트 파일 외 컴포넌트는 export const 화살표 함수, 한 파일 한 컴포넌트, Props는 {Component}Props interface
        - 쿼리 키는 lib/queryKeys.ts에서만 정의
        - Tailwind CSS v4 문법 필수: tailwind.config.js 금지(@theme 사용), bg-(--x) ✓ / bg-[var(--x)] ✗, flex! ✓ / !flex ✗, shadow-xs·rounded-xs·outline-hidden 등 v4 이름
        - 중장년 사용자 대상: 글자 크기, 명암 대비, 키보드 조작 등 접근성 확인

    - path: "backend/app/**/*.py"
      instructions: |
        FastAPI 규칙:
        - 호출 방향은 router → service → repository 한 방향. 라우터에 업무 로직·DB 쿼리 금지
        - 비밀값 하드코딩 금지, 설정은 app/core/config.py
        - 파일 입출력은 encoding="utf-8" 명시 (Windows 개발 환경)

    - path: "backend/app/agent/**"
      instructions: |
        AI 에이전트 규칙:
        - 프롬프트를 코드 문자열로 쓰지 말고 prompts/ 파일로
        - 모델명 하드코딩 금지, LLM 호출은 app/agent/gateway 경유
        - 도구 이름은 동사_명사, 그래프 노드는 snake_case 동사형
        - LLM 전송 전 주민등록번호 마스킹 경로가 유지되는지 확인
        - experiments/ import 금지

    - path: "backend/alembic/versions/**"
      instructions: |
        마이그레이션 메시지, downgrade 구현, 데이터 손실 가능성을 확인하세요.

    - path: "backend/data/rules/**"
      instructions: |
        모든 행에 출처 URL·출처 날짜·검수자·검수일이 있는지 확인하세요.

    - path: "backend/{tests,evals}/**"
      instructions: |
        실제 개인정보가 아닌 합성 데이터만 쓰는지 확인하세요.
        모델·프롬프트·규칙표를 바꾼 PR이라면 PR 본문에 평가 결과가 있는지 확인하세요.

chat:
  auto_reply: true
