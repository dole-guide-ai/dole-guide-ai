services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dole
      POSTGRES_PASSWORD: dole
      POSTGRES_DB: dole
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dole"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://dole:dole@db:5432/dole
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
