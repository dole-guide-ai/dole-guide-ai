name: 작업 이슈
description: 일감 하나 (담당 1명, 1~2일 안에 끝나는 크기)
title: "[영역] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      placeholder: 이 일을 왜 하는지 한두 줄
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ]
        - [ ]
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: 무엇이 되면 끝인지 (예) 규칙표 파일이 저장소에 올라가고 검수자가 확인함
    validations:
      required: true
  - type: input
    id: output
    attributes:
      label: 결과물 위치
      placeholder: 파일 경로, Figma·노션 링크
  - type: textarea
    id: ref
    attributes:
      label: 참고
      placeholder: 출처 링크, 관련 이슈 번호 (#12), 선행 작업
