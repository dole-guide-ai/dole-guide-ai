name: golden-eval

# 골든셋 평가를 버튼으로 실행합니다: Actions 탭 → golden-eval → Run workflow.
# 결과 표는 실행 화면(Summary)에 바로 뜨고, 보고서 파일은 Artifacts에 남습니다.
# real 모드는 저장소 Secrets의 OPENAI_API_KEY·UPSTAGE_API_KEY와 Variables의 공급자·모델 이름을 씁니다.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "selftest = 채점 코드 점검(AI 없이), real = 실제 AI"
        type: choice
        options: [selftest, real]
        default: selftest
      area:
        description: "실행할 영역"
        type: choice
        options: [all, procedure, form_fill, grounding, masking]
        default: all
      case_set:
        description: "문항 세트: dev = 개발용(고칠 때), test = 검증용(최종 확인 때만), all = 전체"
        type: choice
        options: [all, dev, test]
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 코드 읽기만 합니다. 보고서 올리기(upload-artifact)는 저장소 쓰기 권한이 필요 없습니다.
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
      AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'openai' }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      EXTRACT_PROVIDER: ${{ vars.EXTRACT_PROVIDER || 'openai' }}
      EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
      JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'openai' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_QUERY_MODEL: ${{ vars.EMBEDDING_QUERY_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 도구 버전은 mise.toml에서 읽습니다.
      - uses: jdx/mise-action@v2
      - run: uv sync --frozen
      - name: 골든셋 CSV 검사·JSON 만들기
        run: uv run python -m evals.golden.build
      - name: 골든셋 실행·채점
        env:
          GOLDEN_AGENT: ${{ inputs.agent }}
          GOLDEN_AREA: ${{ inputs.area }}
          GOLDEN_SET: ${{ inputs.case_set }}
        run: >-
          uv run pytest evals/test_golden.py -m eval
          --golden-agent="$GOLDEN_AGENT" --golden-area="$GOLDEN_AREA" --golden-set="$GOLDEN_SET"
      - name: 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: backend/evals/reports/
          if-no-files-found: ignore
