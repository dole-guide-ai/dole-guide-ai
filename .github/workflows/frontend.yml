name: frontend

on:
  pull_request:
    paths: ["frontend/**", "shared/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "mise.toml", ".github/workflows/frontend.yml"]
  push:
    branches: [main, develop]
    paths: ["frontend/**", "shared/**", "pnpm-lock.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 도구 버전은 mise.toml에서 읽습니다.
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
